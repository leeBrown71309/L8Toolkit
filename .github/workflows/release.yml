name: Release

# Builds and publishes the signed installer when work lands on main (pull request merge).
# The version comes from src-tauri/tauri.conf.json: if a release for it already exists, the build
# is skipped, so bump the version in the pull request to publish a new one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version and check the release does not exist yet
        id: version
        shell: bash
        env:
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pubkey=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SIGNING_KEY" != "true" ] || [ -z "$pubkey" ]; then
            echo "::warning::Update signing is not set up yet (run scripts/setup-update-signing.ps1). Nothing was published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists: bump the version to publish a new one." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.skip == 'false'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.version.outputs.skip == 'false'
      - uses: Swatinem/rust-cache@v2
        if: steps.version.outputs.skip == 'false'
        with:
          workspaces: src-tauri

      - name: Install dependencies
        if: steps.version.outputs.skip == 'false'
        run: bun install --frozen-lockfile

      - name: Build the signed installer
        if: steps.version.outputs.skip == 'false'
        run: bun tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # GitHub rewrites spaces in asset names, so the installer gets a stable name without them.
      - name: Collect the release assets
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p release-assets
          cp "src-tauri/target/release/bundle/nsis/L8 Toolkit_${v}_x64-setup.exe" "release-assets/L8Toolkit_${v}_x64-setup.exe"
          cp "src-tauri/target/release/bundle/nsis/L8 Toolkit_${v}_x64-setup.exe.sig" "release-assets/L8Toolkit_${v}_x64-setup.exe.sig"

      - name: Generate the update manifest
        if: steps.version.outputs.skip == 'false'
        run: bun scripts/make-update-manifest.ts --version "${{ steps.version.outputs.version }}" --notes-file release-notes.md

      - name: Publish the GitHub release
        if: steps.version.outputs.skip == 'false'
        shell: bash
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "v$v" \
            "release-assets/L8Toolkit_${v}_x64-setup.exe" \
            "release-assets/L8Toolkit_${v}_x64-setup.exe.sig" \
            latest.json \
            --title "L8 Toolkit $v" \
            --notes-file release-notes.md \
            --target "${{ github.sha }}"
